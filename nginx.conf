# Run nginx as the nginx user (non-root), not root
user nginx;

# Auto-detect number of CPU cores
worker_processes auto;

# Log errors to stderr so Docker/Kubernetes captures them
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── SECURITY: Hide nginx version number ──────────────────
    # Without this, "Server: nginx/1.27.0" leaks in responses.
    # Attackers use this to find version-specific exploits.
    server_tokens off;

    # ── LOGGING ───────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # ── COMPRESSION ───────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    server {
        # Listen on 8080 (not 80) because non-root can't bind < 1024
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── SECURITY HEADERS ──────────────────────────────────
        # These headers tell the browser how to handle your app.
        # Without them, your app is vulnerable to several attacks.

        # Prevents clickjacking — stops your app being loaded in iframes
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Stops MIME sniffing — browser must use declared content-type
        add_header X-Content-Type-Options "nosniff" always;

        # Forces HTTPS for 1 year (only enable if you have TLS)
        # add_header Strict-Transport-Security "max-age=31536000" always;

        # Content Security Policy — what resources the browser can load
        # For your YouTube clone using RapidAPI + YouTube embeds:
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline';
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src 'self' https://fonts.gstatic.com;
            img-src 'self' data: https://*.ytimg.com https://*.ggpht.com;
            connect-src 'self' https://youtube-v31.p.rapidapi.com;
            frame-src https://www.youtube.com;
        " always;

        # Referrer Policy — controls what URL is sent with requests
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions Policy — disable dangerous browser features
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── REACT ROUTER — SPA ROUTING ────────────────────────
        # Without this, refreshing /video/abc123 returns 404.
        # All routes fall back to index.html, React Router handles it.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── CACHE STATIC ASSETS ───────────────────────────────
        # JS/CSS files have content hashes in their names.
        # Safe to cache for 1 year.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── BLOCK SENSITIVE PATHS ─────────────────────────────
        location ~ /\. {
            deny all;     # block .env, .git, .htaccess etc.
        }
    }
}
