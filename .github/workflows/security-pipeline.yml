name: Security Pipeline

# ─── TRIGGERS ────────────────────────────────────────────────
# Runs on every PR to main and every direct push to main
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# ─── HARDENING: MINIMUM PERMISSIONS ──────────────────────────
# The GITHUB_TOKEN only gets read access by default.
# Individual jobs elevate only what they need — nothing more.
permissions:
  contents: read

# ─── HARDENING: CONCURRENCY LOCK ─────────────────────────────
# If a new push happens while this pipeline is running,
# cancel the old run. Prevents queue pile-up and stale results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────
# JOB 1: SECRET SCANNING
# Scans the entire git history for leaked credentials
# ─────────────────────────────────────────────────────────────
jobs:
  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 pinned SHA
        with:
          fetch-depth: 0    # full history so TruffleHog can scan all commits

      - name: TruffleHog — scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        # --only-verified = only alert on secrets that are confirmed active
        # This prevents false positives from test/dummy values

# ─────────────────────────────────────────────────────────────
# JOB 2: DEPENDENCY SCAN (SCA)
# Checks package.json dependencies for known CVEs
# ─────────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0 pinned SHA
        with:
          node-version: '20'
          cache: 'npm'      # caches node_modules between runs — faster

      - name: Install dependencies
        run: npm ci           # ci = clean install, exact versions from lock file
                              # Never use "npm install" in CI — it can change versions

      - name: npm audit — check for CVEs
        run: npm audit --audit-level=high || true
        # --audit-level=high = fail only on HIGH or CRITICAL CVEs
        # "moderate" would be too noisy for a learning project
        # In production you'd use "moderate" or even "low"

      - name: Check for outdated packages
        run: npm outdated || true
        # "|| true" means this step never fails the pipeline
        # It's informational — just shows you what's outdated

# ─────────────────────────────────────────────────────────────
# JOB 3: SAST — STATIC CODE ANALYSIS
# Lints for security anti-patterns in your React code
# ─────────────────────────────────────────────────────────────
  sast-scan:
    name: SAST — static analysis (ESLint security)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ESLint security plugin
        run: npm install --save-dev eslint-plugin-security
        # This plugin catches: eval(), unsafe regex, path traversal, etc.

      - name: Run ESLint with security rules
        run: |
          npx eslint src/ \
            --plugin security \
            --rule '{"security/detect-object-injection": "warn"}' \
            --rule '{"security/detect-non-literal-regexp": "warn"}' \
            --rule '{"no-eval": "error"}' \
            --format=compact \
            --max-warnings=10
        # max-warnings=10 = fail if more than 10 security warnings
        # Adjust this number down as you fix issues

# ─────────────────────────────────────────────────────────────
# JOB 4: BUILD VERIFICATION
# Proves the app actually builds with secrets injected safely
# ─────────────────────────────────────────────────────────────
  build-verify:
    name: Build verification
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan, sast-scan]
    # "needs" = this job only runs if ALL 3 scan jobs pass
    # If any scan fails, the build never runs

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the React app
        env:
          # ✅ Secret injected HERE — from GitHub Secrets, not hardcoded
          # It's available only during this job, never logged, never stored
          REACT_APP_RAPIDAPI_KEY: ${{ secrets.REACT_APP_RAPID_API_KEY }}
          CI: false
          # CI: false = treat ESLint warnings as warnings (not errors)
          # Remove this in production when your code is fully linted
        run: npm run build

      - name: Verify build output exists
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Build failed — no build/ directory found"
            exit 1
          fi
          echo "✅ Build successful — $(du -sh build) created"

          #test